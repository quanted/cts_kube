# CTS MongoDB PVC
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cts-mongodb-pvc
  namespace: default
  labels:
    type: local
    app: cts-mongodb-pvc
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 5Gi
  storageClassName: ""
  volumeName: cts-mongodb-pv
  selector:
    matchLabels:
      name: cts-mongodb-pv
---
