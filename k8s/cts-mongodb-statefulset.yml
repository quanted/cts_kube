apiVersion: apps/v1
kind: StatefulSet
metadata:
  labels:
    app: cts-mongodb
  name: cts-mongodb
  namespace: default
spec:
  podManagementPolicy: OrderedReady
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: cts-mongodb
  serviceName: cts-mongodb
  template:
    metadata:
      labels:
        app: cts-mongodb
    spec:
      containers:
      - image: ghcr.io/quanted/cts-mongodb:dev-kube-9260d5404080c898ebb651dfe6b5722009de1abc
        imagePullPolicy: Always
        name: cts-mongodb
        ports:
        - containerPort: 27017
          protocol: TCP
        volumeMounts:
        - mountPath: /data/db
          name: cts-mongodb-pv
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      volumes:
      - name: cts-mongodb-pv
        persistentVolumeClaim:
          claimName: cts-mongodb-pvc
