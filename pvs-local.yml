# CTS OPERAWS PV
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: cts-mongodb-pv
  labels:
    type: local
    app: cts-mongodb-pv
spec:
  storageClassName: ""
  accessModes:
    - ReadWriteMany
  capacity:
    storage: 5Gi
  hostPath:
    path: ${CTS_MONGODB_PV_PATH}
---
