##################################
# Persistent Volumes
##################################

# CTS Collected Static PV
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: cts-collected-static-pv
  labels:
    type: local
    app: cts-collected-static-pv
spec:
  storageClassName: cts-collected-static-pv
  accessModes:
    - ReadWriteMany
  capacity:
    storage: 1Gi
  hostPath:
    path: ${CTS_COLLECTED_STATIC_PV_PATH}
---

# CTS OPERAWS PV
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: cts-mongodb-pv
  labels:
    type: local
    app: cts-mongodb-pv
spec:
  storageClassName: cts-mongodb-pv
  accessModes:
    - ReadWriteMany
  capacity:
    storage: 5Gi
  hostPath:
    path: ${CTS_MONGODB_PV_PATH}
---



##################################
# Persistent Volume Controllers
##################################

# CTS Collected Static PVC
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cts-collected-static-pvc
  namespace: default
  labels:
    app: cts-collected-static-pvc
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 1Gi
  selector:
    matchLabels:
      release: "stable"
      name: cts-collected-static-pv
---

# CTS MongoDB PVC
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cts-mongodb-pvc
  namespace: default
  labels:
    app: cts-mongodb-pvc
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 5Gi
  selector:
    matchLabels:
      release: "stable"
      name: cts-mongodb-pv
---
