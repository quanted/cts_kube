apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: cts-api
  name: cts-api
  namespace: default

spec:
  # Stateless: safe to raise for more concurrent calculator requests
  # (each pod runs WEB_CONCURRENCY x GUNICORN_THREADS requests at once).
  replicas: 1
  selector:
    matchLabels:
      app: cts-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: cts-api
    spec:
      containers:
      - name: cts-api
        image: ghcr.io/quanted/cts-flask-api:main-41142fa41ef5fa16619565e1a4bb9f7a3144b3a0
        imagePullPolicy: Always
        # image: cts-flask-api-test
        # imagePullPolicy: Never
        envFrom:
          - configMapRef:
              name: cts-config
        # These take precedence over cts-config.
        env:
          - name: PORT
            value: "5000"
          - name: CTS_API_URL_PREFIX
            value: /ctsshiny/rest          # nginx routes /ctsshiny/rest/ here; Django keeps /cts/rest
          - name: WEB_CONCURRENCY
            value: "2"
          - name: GUNICORN_THREADS
            value: "8"
          - name: GUNICORN_TIMEOUT
            value: "330"
          - name: LOG_LEVEL
            value: INFO
          - name: HOME
            value: /tmp
        ports:
        - containerPort: 5000
          protocol: TCP
        # resources:
        #   requests:
        #     memory: "1Gi"
        #     cpu: "500m"
        #   limits:
        #     memory: "2Gi"
        #     cpu: "2000m"
        # /healthz answers without calling any calculator.
        # readinessProbe:
        #   httpGet:
        #     path: /healthz
        #     port: 5000
        #   initialDelaySeconds: 5
        #   periodSeconds: 10
        #   timeoutSeconds: 5
        # livenessProbe:
        #   httpGet:
        #     path: /healthz
        #     port: 5000
        #   initialDelaySeconds: 20
        #   periodSeconds: 30
        #   timeoutSeconds: 5
        #   failureThreshold: 3
        securityContext:
          runAsNonRoot: true
          runAsUser: 65532
          runAsGroup: 65532
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        volumeMounts:
          - mountPath: /tmp
            name: tmp
      volumes:
      - name: tmp
        emptyDir: {}
      # Lets in-flight requests (OPERA can take minutes) finish during a rollout.
      terminationGracePeriodSeconds: 60
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler