apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: cts-redis
  name: cts-redis
  namespace: qed-kube-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cts-redis
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: cts-redis
    spec:
      containers:
      - image: ghcr.io/quanted/cts-redis:dev-kube-9a1794acadee2e5c09851099d6b1f1b84f1e722e
        imagePullPolicy: Always
      # - image: redis:latest
      #   imagePullPolicy: Never
        name: cts-redis
        livenessProbe:
          exec:
            command:
              - ls
              - /
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 10
        readinessProbe:
          exec:
            command:
              - ls
              - /
          initialDelaySeconds: 10
          periodSeconds: 30
          timeoutSeconds: 10
        ports:
          - containerPort: 6379
            protocol: TCP
      dnsPolicy: ClusterFirst
      restartPolicy: Always
